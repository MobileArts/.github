name: Claude PR Review

# Thin caller. The review logic, prompt and pinned action versions live in
# MobileArts/devops-pipeline/.github/workflows/claude-pr-review.yml.
# - Reviews every PR when opened and on every push.
# - Comment "/review" on the PR to re-run the review.
# - Mention "@claude" in a PR comment or an inline thread to ask a question.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only "/review" and "@claude" comments reach the shared workflow; other
    # comments, including the bots' own, are skipped here.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.comment.user.type != 'Bot' &&
       (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
       (startsWith(github.event.comment.body, '/review') || contains(github.event.comment.body, '@claude')))
    uses: MobileArts/devops-pipeline/.github/workflows/claude-pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
